name: forge-canary

# Weekly: build ferrule-gen and run the gates against Forge's latest commit instead of the pinned
# one, so breakage shows up before anyone bumps the pin (Cargo.toml and scripts/forge-setup.sh).
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  canary:
    name: canary (Forge latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      # Honoured by scripts/forge-setup.sh: overrides the pinned commit.
      FORGE_REF: latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check out Forge latest
        run: mise run forge:setup
      # ferrule-gen pins Forge by git rev (ADR 0014). Move that rev to the fresh checkout's commit
      # rather than [patch]ing to a path: a path source drops the git rev from Cargo.lock, and
      # crates/ferrule-gen/build.rs needs it for `ferrule-gen --version` and ferrule.lock.
      - name: Build against Forge latest
        run: |
          latest="$(git -C .cache/forge rev-parse HEAD)"
          sed -i -E "/^forge = /s/rev = \"[0-9a-f]{40}\"/rev = \"$latest\"/" Cargo.toml
          grep -q "rev = \"$latest\"" Cargo.toml
          cargo update -p forge
          cargo build --release -p ferrule-gen
      - run: cargo test --workspace
      - run: bash scripts/ci/run-if-present.sh oracles:fetch -- onebusaway
      - run: bash scripts/ci/run-if-present.sh golden
      - run: bash scripts/ci/run-if-present.sh parity -- onebusaway
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/open-issue.sh "Forge canary failed against latest release" "forge-canary" "$RUN_URL"
