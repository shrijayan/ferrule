name: docs

on:
  pull_request:
    paths: ["site/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/docs.yml"]
  schedule:
    - cron: "47 4 * * *" # after the nightly parity run, to pick up the newest board
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find latest fidelity board
        id: board
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id="$(gh run list --repo "$REPO" --workflow parity.yml --branch main \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download fidelity board
        if: steps.board.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fidelity-board
          path: reports
          run-id: ${{ steps.board.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Use fidelity board
        run: |
          if [ -f reports/board/fidelity.json ]; then
            cp reports/board/fidelity.json site/src/data/fidelity.json
          else
            echo "::notice::no fidelity board artifact; building with the committed data"
          fi
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: bash scripts/ci/run-if-present.sh docs:build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && hashFiles('site/dist/index.html') != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
