name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # One component, one version, one vX.Y.Z tag and release (ADR 0021).
  release-please:
    name: release-please
    # workflow_dispatch can target any branch; only main may release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      sha: ${{ steps.rp.outputs.sha }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ferrule-gen archives for the curl installer (site/public/install.sh). A manual run builds
  # them as workflow artifacts only, to check every target before a release.
  build-binaries:
    name: build ferrule-gen (${{ matrix.target }})
    needs: release-please
    if: always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc floor at 2.35.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Build exactly the commit release-please tagged.
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
      - name: Add the Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p ferrule-gen --target "$TARGET"
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="ferrule-gen-$TARGET"
          mkdir -p "pkg/$name" dist
          cp LICENSE NOTICE "pkg/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/$TARGET/release/ferrule-gen.exe" "pkg/$name/"
            archive="$name.zip"
            (cd pkg && 7z a -bd "../dist/$archive" "$name" >/dev/null)
          else
            cp "target/$TARGET/release/ferrule-gen" "pkg/$name/"
            archive="$name.tar.gz"
            tar -C pkg -czf "dist/$archive" "$name"
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi > "$archive.sha256"
          cat "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/

  publish-binaries:
    name: attach ferrule-gen archives to the release
    needs: [release-please, build-binaries]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload archives to the GitHub release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist/
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/* --repo "$REPO" --clobber

  # The Python CLI and runtime, at the same version, until the CLI is ported (ADR 0021).
  build-python:
    name: build python (${{ matrix.package }})
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - package: migrate
            dist: ferrule
          - package: runtime
            dist: ferrule-runtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: ./.github/actions/setup
        with:
          install: "false"
      - name: Build sdist and wheel
        env:
          DIST: ${{ matrix.dist }}
        run: uv build --package "$DIST" --out-dir dist/
      - name: CycloneDX SBOM
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          uv venv .sbom-venv
          uv pip install --python .sbom-venv dist/*.whl
          uvx cyclonedx-py environment --output-format JSON --output-file "dist/${PACKAGE}.cdx.json" .sbom-venv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.package }}
          path: dist/

  publish-pypi:
    name: publish ${{ matrix.package }} to PyPI
    needs: [release-please, build-python]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    strategy:
      matrix:
        package: [migrate, runtime]
    permissions:
      contents: write # upload signatures + SBOM to the GitHub release
      id-token: write # PyPI trusted publishing, Sigstore
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.package }}
          path: artifacts/
      - name: Separate SBOM from distributions
        run: |
          mkdir -p dist sbom
          mv artifacts/*.cdx.json sbom/
          mv artifacts/* dist/
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish to PyPI (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true
      - name: Sigstore sign
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Attach signatures and SBOM to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" dist/*.sigstore.json sbom/*.cdx.json --repo "$REPO" --clobber
