name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts:
    name: ts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: mise run lint:ts
      - run: mise run typecheck:ts
      - run: mise run test:ts

  py:
    name: py
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          forge: "false"
      - run: mise run lint:py
      - run: mise run typecheck:py
      - run: mise run test:py

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Golden output
        if: hashFiles('python-plugin/test/golden/**') != ''
        run: bash scripts/ci/run-if-present.sh golden
      - name: Determinism
        if: hashFiles('python-plugin/test/golden/**') != ''
        run: bash scripts/ci/run-if-present.sh determinism
      - name: OneBusAway parity
        if: hashFiles('oracles/manifest.yaml') != ''
        run: bash scripts/ci/run-if-present.sh parity -- onebusaway

  ci:
    name: ci
    if: always()
    needs: [ts, py, gates]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job ended with: $r"; exit 1; }
          done
