name: parity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  parity:
    name: parity (all oracles)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Fetch oracles
        run: bash scripts/ci/run-if-present.sh oracles:fetch
      - name: Run parity
        run: bash scripts/ci/run-if-present.sh parity
      - name: Upload fidelity board
        if: always() && hashFiles('reports/parity/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fidelity-board
          path: reports/parity/
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/ci/open-issue.sh "Nightly parity failed" "parity" "$RUN_URL"
