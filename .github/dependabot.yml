# Daily dependency updates. Security updates are also on in repo settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: daily }
    groups:
      npm-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: daily }
    groups:
      python-minor-patch: { update-types: [minor, patch] }
    commit-message: { prefix: chore, include: scope }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily }
    groups:
      actions: { patterns: ["*"] }
    commit-message: { prefix: ci, include: scope }
