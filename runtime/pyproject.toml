[project]
name = "ferrule-runtime"
version = "0.0.0"
description = "Runtime support code vendored into Ferrule-generated Python SDKs."
license = "Apache-2.0"
requires-python = ">=3.12"
# ferrule_runtime itself only reads its template. These are the dependencies of the rendered
# runtime (the same set a Stainless-generated SDK declares), so the behaviour tests can import it.
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=1.9,<3",
  "anyio>=4.15.1,<5",
  "typing-extensions>=4.14,<5",
  "distro>=1.7.0,<2",
  "sniffio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferrule_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "ferrule_runtime/template"
"typescript/template" = "ferrule_runtime/typescript/template"
"go/template" = "ferrule_runtime/go/template"
"java/template" = "ferrule_runtime/java/template"
"ruby/template" = "ferrule_runtime/ruby/template"

[tool.pytest.ini_options]
testpaths = ["tests"]
