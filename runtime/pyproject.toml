[project]
name = "ferrule-runtime"
version = "0.1.0"
description = "Runtime support code vendored into Ferrule-generated Python SDKs."
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<1",
  "pydantic>=1.9,<3",
  "anyio>=4.15.1,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferrule_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
