[project]
name = "ferrule-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["runtime", "migrate"]

[dependency-groups]
dev = [
  "ruff==0.17.1",
  "pyright==1.1.414",
  "mypy==2.4.0",
  "pytest==9.1.1",
  "pytest-cov",
  "hypothesis==6.170.5",
  "syrupy==6.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["oracles/cache", "corpus/cache", ".cache", "crates/python-plugin/tests/golden", "runtime/typescript/template", "runtime/typescript-node/template", "runtime/go/template", "runtime/java/template", "runtime/ruby/template", "runtime/php/template", "target"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "COM812", # conflicts with the formatter
  "ISC001", # conflicts with the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["ferrule", "ferrule_runtime"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "D", "PLR2004", "INP001"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
exclude = ["oracles/cache", "corpus/cache", ".cache", "**/node_modules", "**/.venv", "crates/python-plugin/tests/golden", "runtime/template", "runtime/typescript/template", "runtime/typescript-node/template", "runtime/go/template", "runtime/java/template", "runtime/ruby/template", "runtime/php/template", "target"]

[tool.mypy]
strict = true
python_version = "3.12"
exclude = ["oracles/cache", "corpus/cache", ".cache", "target"]

[tool.coverage.run]
branch = true
source = ["runtime/src", "migrate/src"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.pytest.ini_options]
# Oracle and corpus checkouts are third-party code, read as data and never run (ADR 0009): keep
# collection out of them even when pytest is pointed at their parent directory.
norecursedirs = ["*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}", "cache"]
testpaths = ["runtime/tests", "migrate/tests", "oracles/tests", "corpus/tests", "scripts/parity/tests", "action/scripts/tests", "scripts/corpus/tests", "scripts/board/tests"]
