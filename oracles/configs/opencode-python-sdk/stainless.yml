# stainless.yml for shrijayan/opencode-python-sdk v0.2.3, written as an adopter would.
# The resource tree is drafted from the SDK's api.md by scripts/opencode/api_md_to_config.py;
# client settings follow src/opencode/_client.py. The spec comes from
# scripts/opencode/contract_to_openapi.py (ADR 0013).
organization:
  name: opencode
  docs: https://opencode.ai/docs
  contact: https://github.com/shrijayan/opencode-python-sdk/issues

security:
  - basicAuth: []

security_schemes:
  basicAuth:
    type: http
    scheme: basic

client_settings:
  default_client_name: Opencode
  default_env_prefix: OPENCODE
  opts:
    username:
      type: string
      nullable: true
      default: opencode
      auth:
        security_scheme: basicAuth
        role: username
    password:
      type: string
      nullable: true
      read_env: OPENCODE_PASSWORD
      auth:
        security_scheme: basicAuth
        role: password

environments:
  production: http://127.0.0.1:4096

targets:
  python:
    package_name: opencode
    project_name: opencode-python-sdk
    publish:
      pypi: false

readme:
  example_requests:
    default:
      type: request
      endpoint: get /api/session
      params: {}
    headline:
      type: request
      endpoint: get /api/session
      params: {}

resources:
  agent:
    methods:
      list: get /api/agent
      get: get /api/agent/{agentID}
  command:
    methods:
      list: get /api/command
  config:
    methods:
      get: get /api/config
      shells: get /api/config/shell
      update: patch /api/experimental/config
  credential:
    methods:
      list: get /api/credential
      create: post /api/credential
      update: patch /api/credential/{credentialID}
      activate: post /api/credential/{credentialID}/activate
      remove: delete /api/credential/{credentialID}
  debug:
    subresources:
      location:
        methods:
          list: get /api/debug/location
          evict: delete /api/debug/location
  event:
    methods:
      subscribe: get /api/event
  experimental:
    subresources:
      persistent_pty:
        methods:
          read: get /api/experimental/session/{sessionID}/terminal/read
          list: get /api/experimental/session/{sessionID}/terminal
          create: post /api/experimental/session/{sessionID}/terminal
          shutdown: post /api/experimental/persistent-pty/shutdown
          handoff: post /api/experimental/persistent-pty/handoff
          get: get /api/experimental/persistent-pty/{ptyID}
          update: put /api/experimental/persistent-pty/{ptyID}
          snapshot: get /api/experimental/persistent-pty/{ptyID}/snapshot
          remove: delete /api/experimental/persistent-pty/{ptyID}
          connect_token: post /api/experimental/persistent-pty/{ptyID}/connect-token
  file:
    methods:
      read: get /api/fs/read/{path}
      list: get /api/fs/list
      find: get /api/fs/find
      write: post /api/experimental/fs/write
  form:
    methods:
      list: get /api/form
  generate:
    methods:
      text: post /api/experimental/generate
  integration:
    methods:
      list: get /api/integration
      get: get /api/integration/{integrationID}
    subresources:
      wellknown:
        methods:
          add: post /api/experimental/integration/wellknown
      connect:
        methods:
          key: post /api/integration/{integrationID}/connect/key
          external: post /api/integration/{integrationID}/connect/external
      oauth:
        methods:
          connect: post /api/integration/{integrationID}/connect/oauth
          status: get /api/integration/{integrationID}/connect/oauth/{attemptID}
          complete: post /api/integration/{integrationID}/connect/oauth/{attemptID}/complete
          cancel: delete /api/integration/{integrationID}/connect/oauth/{attemptID}
      command:
        methods:
          connect: post /api/integration/{integrationID}/connect/command
          status: get /api/integration/{integrationID}/connect/command/{attemptID}
          cancel: delete /api/integration/{integrationID}/connect/command/{attemptID}
  location:
    methods:
      get: get /api/location
      reload: post /api/location/reload
  mcp:
    methods:
      list: get /api/mcp
      add: put /api/experimental/mcp/{server}
      remove: delete /api/experimental/mcp/{server}
      connect: post /api/experimental/mcp/{server}/connect
      disconnect: post /api/experimental/mcp/{server}/disconnect
    subresources:
      resource:
        methods:
          catalog: get /api/mcp/resource
  message:
    methods:
      list: get /api/session/{sessionID}/message
  migration:
    subresources:
      v1:
        methods:
          status: get /api/experimental/migration/v1
  model:
    methods:
      list: get /api/model
      default: get /api/model/default
  permission:
    methods:
      create: post /api/session/{sessionID}/permission
      list: get /api/session/{sessionID}/permission
      get: get /api/session/{sessionID}/permission/{requestID}
      reply: post /api/session/{sessionID}/permission/{requestID}/reply
    subresources:
      request_:
        methods:
          list: get /api/permission/request
      saved:
        methods:
          list: get /api/permission/saved
          update: patch /api/permission/saved/{id}
          remove: delete /api/permission/saved/{id}
  plugin:
    methods:
      list: get /api/plugin
      check: post /api/plugin/check
      update: post /api/plugin/update
  project:
    methods:
      list: get /api/project
      update: patch /api/project/{projectID}
  provider:
    methods:
      list: get /api/provider
      get: get /api/provider/{providerID}
  pty:
    methods:
      list: get /api/pty
      create: post /api/pty
      get: get /api/pty/{ptyID}
      update: put /api/pty/{ptyID}
      remove: delete /api/pty/{ptyID}
    subresources:
      connect:
        methods:
          token: post /api/pty/{ptyID}/connect-token
  reference:
    methods:
      list: get /api/reference
  rpc:
    methods:
      call: post /api/rpc/{rpcID}/{method}
  server:
    methods:
      info: get /api/info
      pair: post /api/pair
      connect: get /auth/connect/{code}
  session:
    methods:
      list: get /api/session
      stats: get /api/experimental/session/stats
      create: post /api/session
      import_: post /api/experimental/session/import
      export: get /api/experimental/session/{sessionID}/export
      active: get /api/session/active
      get: get /api/session/{sessionID}
      remove: delete /api/session/{sessionID}
      fork: post /api/session/{sessionID}/fork
      switch_agent: post /api/session/{sessionID}/agent
      switch_model: post /api/session/{sessionID}/model
      update: patch /api/session/{sessionID}
      move: post /api/session/{sessionID}/move
      prompt: post /api/session/{sessionID}/prompt
      command: post /api/session/{sessionID}/command
      skill: post /api/experimental/session/{sessionID}/skill
      synthetic: post /api/session/{sessionID}/synthetic
      shell: post /api/session/{sessionID}/shell
      compact: post /api/session/{sessionID}/compact
      wait: post /api/experimental/session/{sessionID}/wait
      context: get /api/session/{sessionID}/context
      diff: get /api/session/{sessionID}/diff
      generate: post /api/session/{sessionID}/generate
      log: get /api/experimental/session/{sessionID}/log
      interrupt: post /api/session/{sessionID}/interrupt
      background: post /api/session/{sessionID}/background
      environment: put /api/session/{sessionID}/environment
      view: post /api/session/{sessionID}/view
    subresources:
      revert:
        methods:
          stage: post /api/session/{sessionID}/revert/stage
          clear: delete /api/session/{sessionID}/revert
          commit: post /api/session/{sessionID}/revert/commit
      inbox:
        methods:
          list: get /api/session/{sessionID}/inbox
          cancel: delete /api/session/{sessionID}/inbox/{inboxID}
          update: patch /api/session/{sessionID}/inbox/{inboxID}
      instructions:
        subresources:
          entry:
            methods:
              list: get /api/experimental/session/{sessionID}/instructions/entries
              put: put /api/experimental/session/{sessionID}/instructions/entries/{key}
              remove: delete /api/experimental/session/{sessionID}/instructions/entries/{key}
      message:
        methods:
          get: get /api/session/{sessionID}/message/{messageID}
      form:
        methods:
          list: get /api/session/{sessionID}/form
          create: post /api/session/{sessionID}/form
          get: get /api/session/{sessionID}/form/{formID}
          reply: post /api/session/{sessionID}/form/{formID}/reply
          cancel: delete /api/session/{sessionID}/form/{formID}
  shell:
    methods:
      list: get /api/shell
      create: post /api/shell
      get: get /api/shell/{id}
      output: get /api/shell/{id}/output
      remove: delete /api/shell/{id}
  skill:
    methods:
      list: get /api/skill
  vcs:
    methods:
      init: post /api/vcs/init
      get: get /api/vcs
      base: get /api/vcs/base
      status: get /api/vcs/status
      diff: get /api/vcs/diff
    subresources:
      branch:
        methods:
          list: get /api/vcs/branch
  voice:
    methods:
      session: post /api/experimental/voice/session
  websearch:
    methods:
      providers: get /api/websearch/provider
      query: post /api/websearch
  worktree:
    methods:
      list: get /api/worktree
      create: post /api/worktree
      remove: delete /api/worktree
      refresh: post /api/worktree/refresh
