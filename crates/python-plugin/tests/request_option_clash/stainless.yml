organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

resources:
  containers:
    methods:
      stop: post /containers/{id}/stop
  calls:
    methods:
      create: post /calls
readme:
  example_requests:
    default: {type: request, endpoint: 'post /calls', params: {}}
    headline: {type: request, endpoint: 'post /calls', params: {}}
