openapi: 3.1.0
info: {title: fx, version: '1'}
servers: [{url: 'https://api.example.com'}]

paths:
  /completions:
    post:
      operationId: createCompletion
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateRequest'}}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object, properties: {id: {type: string}}}}}}
components:
  schemas:
    Base:
      type: object
      properties:
        top_logprobs: {type: [integer, 'null'], description: Base description.}
    Middle:
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          properties:
            top_logprobs: {type: integer, description: Middle description.}
    CreateRequest:
      allOf:
        - $ref: '#/components/schemas/Middle'
        - type: object
          required: [model]
          properties:
            model: {type: string}
            top_logprobs: {type: [integer, 'null'], description: Outer description.}
