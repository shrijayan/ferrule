organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

resources:
  chat:
    subresources:
      completions:
        methods:
          create: post /chat/completions
readme:
  example_requests:
    default: {type: request, endpoint: 'post /chat/completions', params: {}}
    headline: {type: request, endpoint: 'post /chat/completions', params: {}}
