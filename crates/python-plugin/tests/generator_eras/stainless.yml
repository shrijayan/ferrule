organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

resources:
  workspaces:
    methods:
      get: get /workspaces/{workspace_id}
    subresources:
      peers:
        methods:
          list: get /workspaces/{workspace_id}/peers
  keys:
    methods:
      create: post /keys
readme:
  example_requests:
    default: {type: request, endpoint: 'post /keys', params: {}}
    headline: {type: request, endpoint: 'post /keys', params: {}}
