organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

resources:
  guides:
    methods:
      activate: put /guides/{guide_key}/activate
  origins:
    models:
      origin_request: OriginRequest
    methods:
      create: post /origins
readme:
  example_requests:
    default: {type: request, endpoint: 'post /origins', params: {}}
    headline: {type: request, endpoint: 'post /origins', params: {}}
