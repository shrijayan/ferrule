openapi: 3.1.0
info: {title: fx, version: '1'}
servers: [{url: 'https://api.example.com'}]

paths:
  /workspaces/list:
    post:
      operationId: listWorkspaces
      requestBody:
        content:
          application/json:
            schema:
              anyOf: [{$ref: '#/components/schemas/WorkspaceGet'}, {type: 'null'}]
              description: Filtering options
      responses:
        '200': {description: ok, content: {application/json: {schema: {type: object, properties: {id: {type: string}}}}}}
components:
  schemas:
    WorkspaceGet:
      type: object
      properties:
        filters: {anyOf: [{type: object, additionalProperties: true}, {type: 'null'}]}
