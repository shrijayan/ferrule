organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

resources:
  sessions:
    methods:
      summaries: get /sessions/{session_id}/summaries
      context: get /sessions/{session_id}/context
readme:
  example_requests:
    default: {type: request, endpoint: 'get /sessions/{session_id}/summaries', params: {}}
    headline: {type: request, endpoint: 'get /sessions/{session_id}/summaries', params: {}}
