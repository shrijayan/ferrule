openapi: 3.1.0
info: {title: fx, version: '1'}
servers: [{url: 'https://api.example.com'}]

paths:
  /things/{id}:
    get:
      operationId: getThing
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Thing'}}}}
        '404': {description: missing, content: {application/json: {schema: {$ref: '#/components/schemas/NotFoundError'}}}}
components:
  schemas:
    Thing:
      type: object
      properties: {id: {type: string}}
      required: [id]
    NotFoundError:
      type: object
      description: The body of a 404.
      properties:
        message: {type: string}
        resource: {type: string}
      required: [message]
