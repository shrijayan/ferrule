openapi: 3.1.0
info: {title: fx, version: '1'}
servers: [{url: 'https://api.example.com'}]

paths:
  /sessions/{id}/act:
    post:
      operationId: SessionAct
      summary: Perform an action
      description: Executes a browser action using natural language instructions.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActRequest'}}}
      responses:
        '200':
          description: ok
          content:
            application/json: {schema: {$ref: '#/components/schemas/ActResponse'}}
            text/event-stream: {schema: {$ref: '#/components/schemas/StreamEvent'}}
  /completions:
    post:
      operationId: createCompletion
      summary: Create a completion.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CompletionRequest'}}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Completion'}}}}
components:
  schemas:
    ActRequest:
      type: object
      required: [input]
      properties:
        input: {type: string, description: Natural language instruction}
        frameId: {anyOf: [{type: string}, {type: 'null'}], description: Target frame ID for the action}
        streamResponse: {type: boolean, description: Whether to stream the response via SSE}
    ActResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, description: Whether the action succeeded}
    StreamEvent:
      type: object
      required: [id, type]
      properties:
        id: {type: string, description: Unique identifier for this event}
        type: {type: string, enum: [system, log], description: Type of stream event}
    CompletionRequest:
      type: object
      required: [model, prompt]
      properties:
        model: {type: string, description: The model to use.}
        prompt: {type: string, description: The prompt to complete.}
        max_tokens: {anyOf: [{type: integer}, {type: 'null'}], description: The maximum number of tokens.}
        stream: {anyOf: [{type: boolean}, {type: 'null'}], description: Whether to stream the response.}
    Completion:
      type: object
      required: [id]
      properties:
        id: {type: string}
        text: {type: string}
