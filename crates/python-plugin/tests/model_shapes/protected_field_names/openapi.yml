openapi: 3.0.0
info: {title: fx, version: '1'}
servers: [{url: 'https://api.example.com'}]

paths:
  /tenants/{id}:
    get:
      operationId: getTenant
      summary: Gets a tenant.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Tenant'}}}}
    put:
      operationId: setTenant
      summary: Sets a tenant.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties:
                model_id: {description: The model to use., type: string}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Tenant'}}}}
components:
  schemas:
    Tenant:
      description: A tenant entity.
      type: object
      required: [__typename, id]
      properties:
        __typename: {description: The typename of the schema., type: string}
        id: {description: The unique identifier for the tenant., type: string}
        model_id: {description: The model to use., type: string}
