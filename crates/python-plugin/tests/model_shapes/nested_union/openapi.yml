openapi: 3.1.0
info: {title: fx, version: '1'}
servers: [{url: 'https://api.example.com'}]

paths:
  /responses/compact:
    post:
      operationId: compactResponse
      summary: Compacts a conversation.
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/CompactedResponse'}}}}
components:
  schemas:
    CompactedResponse:
      type: object
      required: [id, output]
      properties:
        id: {type: string}
        output:
          type: array
          items: {$ref: '#/components/schemas/OutputUnion'}
    OutputUnion:
      anyOf:
        - oneOf:
            - {$ref: '#/components/schemas/MessageOutput'}
            - {$ref: '#/components/schemas/FunctionToolCall'}
          discriminator:
            propertyName: type
            mapping:
              message: '#/components/schemas/MessageOutput'
              function_call: '#/components/schemas/FunctionToolCall'
        - {$ref: '#/components/schemas/Compaction'}
    MessageOutput:
      type: object
      required: [id, type]
      properties:
        id: {type: string}
        type: {type: string, enum: [message]}
    FunctionToolCall:
      type: object
      required: [name, type]
      properties:
        name: {type: string}
        type: {type: string, enum: [function_call]}
    Compaction:
      type: object
      required: [encrypted_content, type]
      properties:
        encrypted_content: {type: string}
        type: {type: string, enum: [compaction]}
