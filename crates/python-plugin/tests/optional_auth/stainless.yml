organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}
client_settings:
  opts:
    username:
      type: string
      nullable: true
      default: fx
      auth: {security_scheme: basicAuth, role: username}
    password:
      type: string
      nullable: true
      read_env: FX_PASSWORD
      auth: {security_scheme: basicAuth, role: password}

resources:
  health:
    methods:
      check: get /health
readme:
  example_requests:
    default: {type: request, endpoint: 'get /health', params: {}}
    headline: {type: request, endpoint: 'get /health', params: {}}
