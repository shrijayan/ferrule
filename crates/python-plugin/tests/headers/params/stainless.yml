organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

resources:
  models:
    models:
      model: '#/components/schemas/Model'
    methods:
      retrieve: get /models/{model_id}
      list: get /models
  sessions:
    models:
      stream_event: '#/components/schemas/StreamEvent'
    methods:
      act:
        endpoint: post /sessions/{id}/act
        type: http
        streaming:
          param_discriminator: streamResponse
          stream_event_model: sessions.stream_event
          params_type_name: streamResponse
      end: post /sessions/{id}/end
streaming:
  on_event:
    - event_type: error
      handle: error
    - kind: fallthrough
      handle: yield
readme:
  example_requests:
    default: {type: request, endpoint: 'get /models', params: {}}
    headline: {type: request, endpoint: 'get /models', params: {}}
