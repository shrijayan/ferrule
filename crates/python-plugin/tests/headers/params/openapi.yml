openapi: 3.1.0
info: {title: fx, version: '1'}
servers: [{url: 'https://api.example.com'}]

paths:
  /models:
    get:
      operationId: listModels
      summary: List models.
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer}, description: Maximum number of models to return.}
        - {name: after_id, in: query, required: false, schema: {type: string}, description: Return models after this model ID.}
        - {name: anthropic-version, in: header, required: false, schema: {type: string}}
        - {name: x-goog-api-key, in: header, required: false, schema: {type: string}}
        - {name: x-goog-api-client, in: header, required: false, schema: {type: string}}
        - {name: x-goog-user-project, in: header, required: false, schema: {type: string}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/ModelList'}}}}
  /models/{model_id}:
    get:
      operationId: getModel
      summary: Get a model by its identifier.
      parameters:
        - {name: model_id, in: path, required: true, schema: {type: string}}
        - {name: anthropic-version, in: header, required: false, schema: {type: string}}
        - {name: x-goog-api-key, in: header, required: false, schema: {type: string}}
        - {name: x-goog-api-client, in: header, required: false, schema: {type: string}}
        - {name: x-goog-user-project, in: header, required: false, schema: {type: string}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/Model'}}}}
  /sessions/{id}/act:
    post:
      operationId: SessionAct
      summary: Perform an action
      description: Executes a browser action using natural language instructions.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: x-stream-response, in: header, required: false, description: Whether to stream the response via SSE, schema: {type: string, enum: ['true', 'false']}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ActRequest'}}}
      responses:
        '200':
          description: ok
          content:
            application/json: {schema: {$ref: '#/components/schemas/ActResponse'}}
            text/event-stream: {schema: {$ref: '#/components/schemas/StreamEvent'}}
  /sessions/{id}/end:
    post:
      operationId: SessionEnd
      summary: End a browser session
      description: Terminates the browser session and releases all associated resources.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
        - {name: x-stream-response, in: header, required: false, description: Whether to stream the response via SSE, schema: {type: string, enum: ['true', 'false']}}
      responses:
        '200': {description: ok, content: {application/json: {schema: {$ref: '#/components/schemas/EndResponse'}}}}
components:
  schemas:
    Model:
      type: object
      required: [id]
      properties:
        id: {type: string}
    ModelList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Model'}}
    ActRequest:
      type: object
      required: [input]
      properties:
        input: {type: string, description: Natural language instruction}
        frameId: {anyOf: [{type: string}, {type: 'null'}], description: Target frame ID for the action}
        streamResponse: {type: boolean, description: Whether to stream the response via SSE}
    ActResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean, description: Whether the action succeeded}
    EndResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
    StreamEvent:
      type: object
      required: [id, type]
      properties:
        id: {type: string, description: Unique identifier for this event}
        type: {type: string, enum: [system, log], description: Type of stream event}
