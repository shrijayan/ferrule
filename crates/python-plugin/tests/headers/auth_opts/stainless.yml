organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

client_settings:
  opts:
    BROWSERBASE_API_KEY:
      type: string
      read_env: BROWSERBASE_API_KEY
      description: Your Browserbase API Key
      nullable: false
      auth:
        security_scheme: BBApiKeyAuth
    BROWSERBASE_PROJECT_ID:
      type: string
      read_env: BROWSERBASE_PROJECT_ID
      description: Deprecated.
      nullable: true
      auth:
        security_scheme: BBProjectIdAuth
    MODEL_API_KEY:
      type: string
      read_env: MODEL_API_KEY
      description: Your LLM provider API key
      nullable: false
      auth:
        security_scheme: LLMModelApiKeyAuth

security_schemes:
  BBApiKeyAuth:
    type: apiKey
    in: header
    name: x-bb-api-key
  BBProjectIdAuth:
    type: apiKey
    in: header
    name: x-bb-project-id
  LLMModelApiKeyAuth:
    type: apiKey
    in: header
    name: x-model-api-key

security:
  - BBApiKeyAuth: []
    BBProjectIdAuth: []
    LLMModelApiKeyAuth: []

resources:
  sessions:
    methods:
      end: post /sessions/{id}/end
readme:
  example_requests:
    default: {type: request, endpoint: 'post /sessions/{id}/end', params: {id: x}}
    headline: {type: request, endpoint: 'post /sessions/{id}/end', params: {id: x}}
