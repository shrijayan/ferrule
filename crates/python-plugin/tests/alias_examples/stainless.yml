organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

resources:
  $shared:
    models:
      session_id: Session.ID
      model_ref: ModelRef
  sessions:
    methods:
      retrieve: get /sessions/{sessionID}
      switch_model: post /sessions/{sessionID}/model
readme:
  example_requests:
    default: {type: request, endpoint: 'get /sessions/{sessionID}', params: {sessionID: ses_1}}
    headline: {type: request, endpoint: 'get /sessions/{sessionID}', params: {sessionID: ses_1}}
