organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}
settings:
  unwrap_response_fields: [data]
  unwrap_multiproperty_response_fields: true

resources:
  $shared:
    models:
      provider_info: ProviderInfo
  providers:
    methods:
      list: get /providers
  sessions:
    models:
      session_info: SessionInfo
    methods:
      retrieve: get /sessions/{id}
readme:
  example_requests:
    default: {type: request, endpoint: 'get /providers', params: {}}
    headline: {type: request, endpoint: 'get /providers', params: {}}
