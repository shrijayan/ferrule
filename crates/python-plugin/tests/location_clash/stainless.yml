organization: {name: fx}
targets:
  python: {package_name: fx, production_repo: fx/fx-python, publish: {pypi: false}}
environments: {production: 'https://api.example.com'}

resources:
  zones:
    methods:
      replace: put /zones/{name}
  recipients:
    methods:
      create: post /accounts/{account_id}/shares/{share_id}/recipients
  pods:
    methods:
      delete: delete /pods/{name}
readme:
  example_requests:
    default: {type: request, endpoint: 'put /zones/{name}', params: {}}
    headline: {type: request, endpoint: 'put /zones/{name}', params: {}}
