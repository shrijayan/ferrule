[package]
name = "acme-notes"
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
description = "Rust SDK for the Acme Notes API"
readme = "README.md"

[features]
# A client whose calls block, on a runtime of its own.
blocking = []
# A fake server that answers like the API, for tests.
testing = []

[dependencies]
bytes = "1.10"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.45", features = ["rt", "time"] }

[dev-dependencies]
tokio = { version = "1.45", features = ["macros", "rt-multi-thread"] }
