[tools]
node = "24"
pnpm = "11.24.0"
python = "3.12"
uv = "0.11.28"
lefthook = "latest"
gitleaks = "latest"
# Same channel as rust-toolchain.toml and the pinned Forge commit (ADR 0014).
rust = { version = "1.99.0", components = "rustfmt,clippy" }
# gofmt checks the Go plugin's output; go build/vet/test run the generated Go SDKs.
go = "1.27.1"
# The JVM plugin's Kotlin output is formatted by ktfmt --kotlinlang-style at the version the
# Stainless JVM SDKs' buildSrc pins; the JDK runs it and the generated SDKs' ./gradlew.
java = "temurin-21.0.13+9.0.LTS"
"github:facebook/ktfmt" = { version = "0.61", asset_pattern = "ktfmt-0.61-with-dependencies.jar" }
# The Ruby plugin's formatters (crates/ruby-plugin/tools/Gemfile) and the generated gems' tests;
# the gems need Ruby >= 3.2.
ruby = "3.4.12"
# The C# plugin's formatter (csharpier, crates/csharp-plugin/tools/dotnet-tools.json) and the
# generated SDKs' builds and tests; the SDKs target net8.0, as the oracles' CI does.
dotnet = "8.0.426"

[tasks."forge:setup"]
description = "Check out the pinned Forge commit into .cache/forge (for the canary)"
run = "bash scripts/forge-setup.sh"

[tasks.install]
run = ["pnpm install --frozen-lockfile", "uv sync --all-packages --frozen"]

[tasks."lint:ts"]
run = "pnpm exec biome check ."

[tasks."lint:py"]
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks."typecheck:py"]
run = ["uv run pyright", "uv run mypy runtime/src migrate/src", "uv run mypy -p scripts.parity", "uv run mypy -p scripts.corpus", "uv run mypy -p scripts.board"]

[tasks."test:py"]
run = "uv run pytest"

[tasks."lint:rs"]
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks."test:rs"]
run = "cargo test --workspace --locked"

[tasks."ruby:tools"]
description = "Install the Ruby plugin's formatters (crates/ruby-plugin/tools/Gemfile.lock) into .cache/ruby-tools"
run = "bash crates/ruby-plugin/tools/install.sh"

[tasks."php:tools"]
description = "Install PHP and the PHP plugin's formatter (crates/php-plugin/tools/composer.lock) into .cache/php-tools"
run = "bash crates/php-plugin/tools/install.sh"

[tasks."csharp:tools"]
description = "Install the C# plugin's formatter (csharpier, crates/csharp-plugin/tools/dotnet-tools.json) into .cache/csharp-tools"
run = "bash crates/csharp-plugin/tools/install.sh"

[tasks.check]
description = "Everything ci.yml runs"
depends = ["lint:ts", "lint:py", "lint:rs", "typecheck:py", "test:py", "test:rs"]

[tasks."forge:telemetry"]
description = "Fail if Forge gains a network-capable dependency (ADR 0006)"
run = "bash scripts/forge-telemetry-check.sh"

[tasks."docs:build"]
run = "pnpm --filter @ferrule/docs build"

[tasks."release:dry-run"]
run = "bash scripts/release-dry-run.sh"

[tasks."oracles:fetch"]
run = "python3 oracles/fetch.py"

[tasks."corpus:fetch"]
run = "python3 corpus/fetch.py"

[tasks."build:gen"]
description = "Build target/release/ferrule-gen: converter, Forge and the Python plugin in one binary"
run = "cargo build --release --locked -p ferrule-gen"

[tasks.golden]
description = "Golden output: plugin goldens, agent context, project files vs the oracle, converter and SDK model snapshots"
run = [
  "cargo test -p ferrule-python-plugin --test golden --test agent --test files_oracle --test project_files_oracles",
  "cargo test -p ferrule-converter --test goldens",
  "cargo test -p ferrule-sdk-model --test snapshots --test python_cross_check",
]

[tasks.spike]
description = "Phase 1 gate: OneBusAway agencies_with_coverage through ferrule-gen"
run = "bash scripts/spike.sh"

[tasks."converter:oracles"]
description = "Phase 2 gate: convert every config oracle and compare with snapshots"
depends = ["build:gen"]
run = "python3 -m scripts.oracles.converter_oracles"

[tasks.parity]
description = "Regenerate an oracle and measure parity"
depends = ["build:gen"]
run = "uv run python -m scripts.parity.run"

[tasks."adopt:gate"]
description = "Phase 4 gate: adopt five public Stainless SDKs locally and prove nothing changed"
depends = ["build:gen"]
run = "uv run python -m scripts.adopt.gate"

[tasks.corpus]
description = "Run the spec corpus through ferrule-gen and the compile gate"
depends = ["build:gen"]
run = "uv run python -m scripts.corpus.run"

[tasks.board]
description = "Build the fidelity board data from reports/parity"
run = "uv run python -m scripts.board.build"
